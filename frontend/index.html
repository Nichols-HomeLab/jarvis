<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Workshop</title>
  </head>
  <body>
    <main class="shell">
      <header><span class="eyebrow">Local Workshop Assistant</span><nav><a href="/dashboard.html">Vision</a><a href="/projector.html">Projector</a><a href="/gestures.html">Gestures</a></nav></header>
      <div class="orb-shell"><canvas id="orb-canvas"></canvas></div>
      <section class="conversation">
        <h1>Jarvis</h1>
        <p id="status-text" aria-live="polite">ready</p>
        <div id="transcript" class="transcript"></div>
        <div id="reply" class="reply" aria-live="polite"></div>
        <button id="confirm-button" type="button" hidden>Confirm action</button>
        <button id="record-button" type="button">Record command</button>
        <form id="command-form"><input id="command-input" aria-label="Command" placeholder="Ask about a tool, a camera, or a project..." /><button type="submit">Send</button></form>
        <small>Click once to start recording and again to stop. Speech uses the configured local endpoint.</small>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
