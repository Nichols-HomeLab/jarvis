services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    environment:
      GROUNDING_DINO_MODEL: /opt/models/grounding-dino-tiny
      YOLO_MODEL: /opt/models/yolo26n.pt
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  searxng:
    image: searxng/searxng:latest@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
